apiVersion: v1
kind: Service
metadata:
  name: pacientes-service
  namespace: veterinaria
  labels:
    app: pacientes-service
    # Este label es el que referencia el ServiceMonitor para encontrar este Service
    monitor: veterinaria
spec:
  type: NodePort
  selector:
    app: pacientes-service
  ports:
    # El nombre "http" es obligatorio: el ServiceMonitor lo referencia por nombre
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
      protocol: TCP
