apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: citas-service-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - veterinaria
  selector:
    matchLabels:
      monitor: veterinaria
      app: citas-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
