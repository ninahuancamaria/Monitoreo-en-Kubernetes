apiVersion: v1
kind: Service
metadata:
  name: citas-service
  namespace: veterinaria
  labels:
    app: citas-service
    monitor: veterinaria
spec:
  type: NodePort
  selector:
    app: citas-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 30082
      protocol: TCP
