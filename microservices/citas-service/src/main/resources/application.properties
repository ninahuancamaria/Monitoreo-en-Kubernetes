server.port=8082
spring.application.name=citas-service

# Actuator: exponer endpoints y mapear /metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.endpoints.web.path-mapping.prometheus=metrics

# URL del servicio de pacientes (se sobreescribe con variable de entorno en K8s)
app.pacientes.url=${PACIENTES_SERVICE_URL:http://localhost:8081}

# Timeout máximo para llamadas a pacientes-service (segundos)
app.pacientes.timeout-segundos=${PACIENTES_TIMEOUT_SEGUNDOS:3}
