server.port=8081
spring.application.name=pacientes-service

# Actuator: exponer todos los endpoints y mapear /metrics a la ruta ra\u00edz de Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Ruta personalizada: /metrics en lugar de /actuator/prometheus
management.endpoints.web.path-mapping.prometheus=metrics

# Delay artificial para Casu\u00edstica 2 (milisegundos, 0 = sin delay)
app.pacientes.artificial-delay-ms=${ARTIFICIAL_DELAY_MS:0}
